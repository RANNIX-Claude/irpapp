# ─── PRODUCCIÓN (rama: master) ────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  VITE_AMBIENTE   = "PRODUCCION"
  VITE_APP_TITLE  = "IRP — Inmueble Resource Planning"
  VITE_APP_URL    = "https://irpapp.netlify.app"
  # VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY se configuran en Netlify UI → Site settings
  # ANTHROPIC_API_KEY y SUPABASE_SERVICE_ROLE_KEY NUNCA aquí — solo en Netlify UI

# ─── QA / DEV (rama: develop) — sitio Netlify separado ────────────────────────
# Las siguientes variables se configuran en el sitio Netlify de QA directamente,
# NO en este archivo. Este bloque es solo referencia documentada.
#
# [context.develop.environment]
#   VITE_AMBIENTE           = "QA"
#   VITE_APP_TITLE          = "IRP QA — Inmueble Resource Planning"
#   VITE_APP_URL            = "https://irpapp-qa.netlify.app"
#   VITE_SUPABASE_URL       = "<URL del proyecto Supabase QA>"
#   VITE_SUPABASE_ANON_KEY  = "<anon key del proyecto Supabase QA>"
