# ─── PRODUCCIÓN (rama: master) ────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."subir-comprobante"]
  timeout = 26

[build.environment]
  NODE_VERSION = "20"
  TZ              = "America/Mexico_City"
  VITE_AMBIENTE   = "PRODUCCION"
  VITE_APP_TITLE  = "IRP — Inmueble Resource Planning"
